name: Run AI News

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-news-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate news and scripts
        run: python run.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      - name: Upload result artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ai-news-${{ github.run_id }}
          path: Riset AI News/20*.md
          if-no-files-found: error
          retention-days: 14
